name: Deploy to REG.RU

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: reg-ru-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check deploy secrets
        env:
          FTP_SERVER: ${{ secrets.REG_RU_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.REG_RU_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.REG_RU_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "REG.RU FTP deploy secrets are missing."
            echo "Add REG_RU_FTP_SERVER, REG_RU_FTP_USERNAME and REG_RU_FTP_PASSWORD in repository secrets."
            exit 1
          fi

      - name: Upload dist to REG.RU
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.REG_RU_FTP_SERVER }}
          username: ${{ secrets.REG_RU_FTP_USERNAME }}
          password: ${{ secrets.REG_RU_FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ secrets.REG_RU_FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
