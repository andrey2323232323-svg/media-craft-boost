name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: manchester-digital-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "VPS deploy secrets are missing."
            echo "Add SSH_HOST, SSH_USER and SSH_KEY in repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist"
          target: "~/manchester-digital-upload"
          rm: true
          overwrite: true

      - name: Publish build on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          SOURCE_SHA: ${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: SOURCE_SHA,DEPLOY_PATH
          command_timeout: 5m
          script: |
            set -e

            detect_deploy_dir() {
              if [ -n "${DEPLOY_PATH}" ]; then
                echo "${DEPLOY_PATH}"
                return 0
              fi

              for base in /etc/nginx /etc/apache2; do
                if [ -d "$base" ]; then
                  files="$(grep -RIl "manchesterdigital.ru" "$base" 2>/dev/null || true)"
                  for file in $files; do
                    dir="$(awk '
                      /root[[:space:]]/ {
                        gsub(";", "", $2);
                        print $2;
                        exit;
                      }
                      /DocumentRoot[[:space:]]/ {
                        print $2;
                        exit;
                      }
                    ' "$file")"
                    if [ -n "$dir" ] && [ -d "$dir" ]; then
                      echo "$dir"
                      return 0
                    fi
                  done
                fi
              done

              for dir in \
                /var/www/www-root/data/www/manchesterdigital.ru \
                /var/www/manchesterdigital.ru \
                /var/www/html/manchesterdigital.ru \
                /home/*/www/manchesterdigital.ru \
                /home/*/domains/manchesterdigital.ru/public_html
              do
                if [ -d "$dir" ]; then
                  echo "$dir"
                  return 0
                fi
              done

              found="$(find /var/www /home -maxdepth 6 -type d -name "manchesterdigital.ru" 2>/dev/null | head -n 1 || true)"
              if [ -n "$found" ]; then
                echo "$found"
                return 0
              fi

              return 1
            }

            DEPLOY_DIR="$(detect_deploy_dir || true)"
            UPLOAD_DIR="$HOME/manchester-digital-upload"
            BUILD_DIR="${UPLOAD_DIR}/dist"

            if [ -z "${DEPLOY_DIR}" ]; then
              echo "Could not detect deploy path for manchesterdigital.ru."
              echo "Set DEPLOY_PATH repository secret manually, or check nginx/apache document root."
              echo "Common candidates found under /var/www and /home:"
              find /var/www /home -maxdepth 5 -type d 2>/dev/null | grep -Ei 'manchester|public_html|www|html' | head -n 120 || true
              exit 1
            fi

            case "${DEPLOY_DIR}" in
              /|/home|/var|/var/www)
                echo "Refusing to deploy to unsafe path: ${DEPLOY_DIR}"
                exit 1
                ;;
            esac

            case "${DEPLOY_DIR}" in
              *manchesterdigital.ru*|*manchester-digital*|*manchester_digital*)
                ;;
              *)
                echo "Refusing to deploy to a path that does not look like the Manchester Digital site: ${DEPLOY_DIR}"
                echo "If this path is correct, set DEPLOY_PATH explicitly to a domain-specific directory."
                exit 1
                ;;
            esac

            if [ ! -d "${BUILD_DIR}" ]; then
              echo "Could not find uploaded dist directory at ${BUILD_DIR}"
              find "${UPLOAD_DIR}" -maxdepth 3 -type f | head -n 80 || true
              exit 1
            fi

            echo "Deploy path: ${DEPLOY_DIR}"
            mkdir -p "${DEPLOY_DIR}"

            # Keep server-only files such as .htaccess, but replace the published site assets.
            find "${DEPLOY_DIR}" -mindepth 1 -maxdepth 1 \
              ! -name ".htaccess" \
              ! -name ".well-known" \
              -exec rm -rf {} +

            cp -a "${BUILD_DIR}/." "${DEPLOY_DIR}/"
            rm -rf "${UPLOAD_DIR}"

            echo "SOURCE_SHA: ${SOURCE_SHA}" > "${DEPLOY_DIR}/deploy-version.txt"
            echo "Deploy finished"
